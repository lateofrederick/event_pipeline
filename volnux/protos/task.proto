syntax = "proto3";

package event_pipeline;

// The task execution service definition
service TaskExecutor {
  // Execute a task remotely
  rpc SubmitTask (SubmitTaskRequest) returns (SubmitTaskResponse) {}

  // Query if an event exists
  rpc QueryEvent (QueryEventRequest) returns (QueryEventResponse) {}

  // Stream task results (for long running tasks)
  rpc SubmitTaskStream (SubmitTaskRequest) returns (stream SubmitTaskResponse) {}

  // Bidirectional streaming for batch operations
  rpc SubmitBatchTasks (stream SubmitTaskRequest) returns (stream SubmitTaskResponse) {}
}

// Request and Response definitions matching volnux.types.Payload structures

message SubmitTaskRequest {
  string type = 1;
  string event_name = 2;
  bytes args = 3;           // serialized json args
  string correlation_id = 4;
  int64 timeout = 5;        // optional timeout (0 if none)
  double timestamp = 6;
  string client_id = 7;
  string hmac = 8;
}

message SubmitTaskResponse {
  string type = 1;
  string correlation_id = 2;
  string status = 3;
  bytes result = 4;        // serialized json result
  string message = 5;      // Error message if any
  string code = 6;         // Error code if any
  double completed_at = 7; // For success
  double timestamp = 8;    // For error
  string hmac = 9;
}

message QueryEventRequest {
  string type = 1;
  string event_name = 2;
  string client_id = 3;
}

message QueryEventResponse {
  string type = 1;
  string event_name = 2;
  bool available = 3;
  string message = 4;
  string metadata = 5; // serialized json metadata
}